
name: Lua批量生成
run-name: 🤖 Lua生成任务
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: '每批处理数量（默认50）'
        required: false
        default: '50'
      start_from:
        description: '从第几个开始（默认0，自动从progress.txt读取）'
        required: false
        default: '0'
      force_regen:
        description: '强制重新生成所有（true/false）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 执行生成脚本
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
          START_FROM: ${{ github.event.inputs.start_from || '0' }}
          FORCE_REGEN: ${{ github.event.inputs.force_regen || 'false' }}
        run: node generate.js

      - name: 提交文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖批量生成lua文件"
          branch: main
          file_patterns: |
            lua/**/*.lua
            progress.txt
            failed_ids.txt
            stats.json
