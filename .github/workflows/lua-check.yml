name: Lua Sync Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run lua sync check
        id: check
        continue-on-error: true
        env:
          LUA_DIR: ${{ github.workspace }}/lua
        run: node check-github-lua.js

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lua-check-report
          path: |
            lua/_github-check.txt
            lua/_github-check.json
          if-no-files-found: ignore
