name: 单个Lua生成
run-name: 生成 ${{ inputs.app_id }} 的 Lua 文件
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Steam AppID (例如 10080)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库完整代码
        uses: actions/checkout@v4
      - name: 配置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install steam-user
      - name: 执行脚本
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          SINGLE_APPID: ${{ inputs.app_id }}
        run: node generate.js
      - name: 提交文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖生成 ${{ inputs.app_id }} 的 Lua 文件"
          branch: main
          file_patterns: |
            lua/${{ inputs.app_id }}.lua
            paid_no_key_ids.txt
