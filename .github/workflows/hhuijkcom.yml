name: Sync SteamToolbox keys

on:
  schedule:
    - cron: "0 19 * * *"   # 北京时间 03:00
  workflow_dispatch:        # 也支持在 Actions 页面手动运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse toolbox3.txt and download keys
        env:
          TOOLBOX_URL: https://raw.githubusercontent.com/BIAO-001/SteamToolbox/main/toolbox3.txt
        run: |
          python3 - <<'PYEOF'
          import os, re, sys, json, urllib.request

          TOOLBOX_URL = os.environ["TOOLBOX_URL"].strip()

          TARGETS = {
              "appaccesstokens": "appaccesstokens.json",
              "depotkeys":       "depotkeys.json",
          }

          def fetch(url, timeout=60):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
              })
              return urllib.request.urlopen(req, timeout=timeout).read()

          try:
              raw = fetch(TOOLBOX_URL, 30).decode("utf-8-sig", errors="replace")
          except Exception as e:
              print(f"::error::Cannot download toolbox3.txt: {e}")
              sys.exit(1)

          links = {}
          for line in raw.splitlines():
              line = line.strip()
              if not line:
                  continue
              parts = re.split(r"[：:]", line, maxsplit=1)
              if len(parts) != 2:
                  continue
              key = parts[0].strip()
              val = parts[1].strip()
              if key in TARGETS and val.lower().startswith(("http://", "https://")):
                  links[key] = val

          downloaded = 0
          for key, out_name in TARGETS.items():
              url = links.get(key)
              if not url:
                  print(f"::warning::{key} not found in toolbox3.txt, keeping old file.")
                  continue
              try:
                  data = fetch(url, 60)
              except Exception as e:
                  print(f"::warning::{key} download failed ({e}), keeping old file.")
                  continue

              if len(data) == 0:
                  print(f"::warning::{key} is empty, keeping old file.")
                  continue

              head = data[:2048].lstrip().lower()
              if head.startswith(b"<html") or head.startswith(b"<!doctype html"):
                  print(f"::warning::{key} returned an HTML page (expired link / captcha), keeping old file.")
                  continue

              try:
                  json.loads(data.decode("utf-8"))
              except Exception as e:
                  print(f"::warning::{key} is not valid JSON ({e}), keeping old file.")
                  continue

              with open(out_name, "wb") as f:
                  f.write(data)
              downloaded += 1
              print(f"OK: {key} -> {out_name} ({len(data)} bytes)")

          print(f"Synced {downloaded}/{len(TARGETS)} file(s).")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appaccesstokens.json depotkeys.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "chore: update keys [skip ci]"
            git push
          fi
