name: Lua完整性检查
run-name: 检查 Lua 完整性 (${{ inputs.app_ids_count }} 个文件)
on:
  workflow_dispatch:
    inputs:
      app_ids:
        description: '逗号分隔的 AppID 列表'
        required: true
        type: string
      webhook_url:
        description: '企业微信 webhook（两个 key 用逗号分隔）'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 steam-user
        run: npm install steam-user

      - name: 写入检测脚本
        run: |
          cat > check-integrity.js << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const SteamUser = require('steam-user');
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';

          const INPUT = process.env.INPUT_APP_IDS || '';
          const APP_IDS = INPUT.split(',').map(s => s.trim()).filter(s => s && /^\d+$/.test(s));

          function parseLuaIds(content) {
            const ids = new Set();
            let m;
            const reApp = /addappid\s*\(\s*(\d+)/g;
            while ((m = reApp.exec(content)) !== null) ids.add(Number(m[1]));
            const reToken = /addtoken\s*\(\s*(\d+)/g;
            while ((m = reToken.exec(content)) !== null) ids.add(Number(m[1]));
            return ids;
          }

          function loginSteam() {
            return new Promise((resolve) => {
              const c = new SteamUser({ enablePicsCache: false, autoRelogin: false });
              let done = false;
              const finish = (ok, reason) => {
                if (done) return;
                done = true;
                clearTimeout(t);
                if (ok) resolve({ ok: true, client: c });
                else { try { c.logOff(); } catch (_) {} resolve({ ok: false, reason }); }
              };
              const t = setTimeout(() => finish(false, 'timeout'), 25000);
              c.once('loggedOn', () => finish(true));
              c.once('error', (e) => finish(false, String(e.message || e)));
              c.once('debug', () => {});
              try { c.logOn({ anonymous: true }); } catch (e) { finish(false, String(e.message)); }
            });
          }

          function getDepotIds(client, appId) {
            return new Promise((resolve) => {
              try {
                client.getProductInfo([appId], [], false, (err, apps) => {
                  if (err || !apps || !apps[appId] || !apps[appId].appinfo || !apps[appId].appinfo.depots) {
                    resolve([]); return;
                  }
                  resolve(Object.keys(apps[appId].appinfo.depots).filter(k => !isNaN(k)).map(Number));
                });
              } catch (_) { resolve([]); }
            });
          }

          async function getDepotIdsTwice(client, appId) {
            if (!client) return [];
            const a = await getDepotIds(client, appId);
            await new Promise(r => setTimeout(r, 800));
            const b = await getDepotIds(client, appId);
            return [...new Set([...a, ...b])].sort((x, y) => x - y);
          }

          async function main() {
            console.log('========================================');
            console.log('Lua integrity check (read-only)');
            console.log('Files:', APP_IDS.length);
            console.log('========================================\n');

            console.log('Steam login...');
            const loginRes = await loginSteam();
            if (!loginRes.ok) { console.log('FAIL:', loginRes.reason); process.exit(1); }
            const client = loginRes.client;
            console.log('OK\n');

            const results = [];
            let okCount = 0, missingCount = 0, extraCount = 0, fileMissingCount = 0, errCount = 0;
            let totalMissing = 0, totalExtra = 0;

            for (let idx = 0; idx < APP_IDS.length; idx++) {
              const appId = APP_IDS[idx];
              const luaPath = path.join('lua', `${appId}.lua`);
              const tag = `[${idx + 1}/${APP_IDS.length}]`;

              try {
                const luaExists = fs.existsSync(luaPath);
                let remoteIds = new Set();
                if (luaExists) {
                  remoteIds = parseLuaIds(fs.readFileSync(luaPath, 'utf-8'));
                }

                const depots = await getDepotIdsTwice(client, Number(appId));
                const realIds = new Set([Number(appId), ...depots]);

                const missing = [...realIds].filter(id => !remoteIds.has(id)).sort((a, b) => a - b);
                const extra   = [...remoteIds].filter(id => !realIds.has(id) && id !== Number(appId)).sort((a, b) => a - b);

                let status = 'ok';
                if (!luaExists) { status = 'file-missing'; fileMissingCount++; }
                else if (missing.length > 0) { status = 'missing'; missingCount++; }
                else if (extra.length > 0) { status = 'extra'; extraCount++; }
                else okCount++;

                totalMissing += missing.length;
                totalExtra += extra.length;

                const icon = status === 'ok' ? '✅' : status === 'file-missing' ? '🗂️' : '⚠️';
                console.log(`${tag} ${icon} ${appId}.lua ${status} steam=${depots.length} remote=${remoteIds.size}`);
                if (!luaExists) console.log(`    🗂️ FILE NOT FOUND: ${luaPath}`);
                if (missing.length > 0) console.log(`    ⚠️ 缺(${missing.length}): ${missing.join(', ')}`);
                if (extra.length > 0)   console.log(`    ⚠️ 多(${extra.length}): ${extra.join(', ')}`);

                results.push({
                  mainAppId: appId, status, fileExists: luaExists,
                  depotCount: depots.length, remoteCount: remoteIds.size, realCount: realIds.size,
                  missingInLua: missing, extraInLua: extra,
                });

                await new Promise(r => setTimeout(r, 1200));

              } catch (e) {
                console.log(`${tag} ❌ ${appId}: ${e.message}`);
                errCount++;
                results.push({ mainAppId: appId, status: 'error', error: e.message });
                await new Promise(r => setTimeout(r, 800));
              }
            }

            console.log('\n========================================');
            console.log(`RESULTS: ${APP_IDS.length} files`);
            console.log(`  ✅ OK:        ${okCount}`);
            console.log(`  ⚠️ 内容缺:    ${missingCount} (共 ${totalMissing} 个ID)`);
            console.log(`  ⚠️ 内容多:    ${extraCount} (共 ${totalExtra} 个ID)`);
            console.log(`  🗂️ 文件缺失:  ${fileMissingCount}`);
            console.log(`  ❌ 错误:      ${errCount}`);
            console.log('========================================');

            const summary = {
              timestamp: new Date().toISOString(),
              total: APP_IDS.length,
              ok: okCount, missing: missingCount, extra: extraCount,
              fileMissing: fileMissingCount, error: errCount,
              missingTotal: totalMissing, extraTotal: totalExtra,
              results,
            };
            fs.writeFileSync('check-result.json', JSON.stringify(summary, null, 2));

            try { client.logOff(); } catch (_) {}
            process.exit(0);
          }

          main().catch(e => { console.error('FATAL:', e); process.exit(1); });
          SCRIPT

      - name: 运行完整性检测
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          INPUT_APP_IDS: ${{ inputs.app_ids }}
        run: node check-integrity.js

      - name: 上传结果 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-result
          path: check-result.json
          if-no-files-found: warn

      - name: 企业微信推送
        if: always() && inputs.webhook_url != ''
        run: |
          python3 -c "
          import json, urllib.request
          s = json.load(open('check-result.json'))
          hasProblem = (s['missing'] + s['extra'] + s.get('fileMissing', 0) + s['error']) > 0
          emoji = '⚠️' if hasProblem else '✅'

          lines = [
            f'## {emoji} Lua 完整性检查',
            f'> **总计:** {s[\"total\"]}',
            f'> ✅ OK: **{s[\"ok\"]}**',
            f'> 🗂️ 文件缺失: **{s.get(\"fileMissing\", 0)}**',
            f'> ⚠️ 内容缺: **{s[\"missing\"]}** ({s[\"missingTotal\"]}个ID)',
            f'> ⚠️ 内容多: **{s[\"extra\"]}** ({s[\"extraTotal\"]}个ID)',
            f'> ❌ 错误: **{s[\"error\"]}**',
            '',
            f'[查看 Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})',
          ]

          # 文件缺失列表
          fm = [r for r in s['results'] if r['status'] == 'file-missing']
          if fm:
            lines.append('')
            lines.append(f'**🗂️ 文件缺失 ({len(fm)}个):**')
            for r in fm[:20]:
              lines.append(f'- `{r[\"mainAppId\"]}.lua`')
            if len(fm) > 20:
              lines.append(f'- ...还有 {len(fm)-20} 个')

          # 内容异常列表
          bad = [r for r in s['results'] if r['status'] in ('missing', 'extra')]
          if bad:
            lines.append('')
            lines.append(f'**⚠️ 内容异常 ({len(bad)}个):**')
            for r in bad[:20]:
              parts = []
              if r.get('missingInLua'): parts.append(f'缺{r[\"missingInLua\"]}')
              if r.get('extraInLua'):   parts.append(f'多{r[\"extraInLua\"]}')
              lines.append(f'- `{r[\"mainAppId\"]}.lua` {\" \".join(parts)}')
            if len(bad) > 20:
              lines.append(f'- ...还有 {len(bad)-20} 个')

          payload = json.dumps({'msgtype': 'markdown', 'markdown': {'content': '\n'.join(lines)}}).encode()
          for url in '${{ inputs.webhook_url }}'.split(','):
            url = url.strip()
            if not url: continue
            try:
              req = urllib.request.Request(url, data=payload, headers={'Content-Type': 'application/json'})
              urllib.request.urlopen(req, timeout=5)
            except Exception as e:
              print(f'push fail: {e}')
          "
