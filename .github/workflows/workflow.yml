name: Steam Lua生成机器人
run-name: Lua批量生成任务
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库完整代码
        uses: actions/checkout@v4

      - name: 配置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install steam-user

      - name: 执行脚本
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # 注入Steam账号信息
          STEAM_ACCOUNT: ${{ secrets.STEAM_ACCOUNT }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_GUARD: ${{ secrets.STEAM_GUARD }}
        run: node generate.js

      - name: 提交文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖机器人更新lua文件与任务日志"
          branch: main
          file_patterns: |
            lua/**/*.lua
            progress.txt
            failed_ids.txt
