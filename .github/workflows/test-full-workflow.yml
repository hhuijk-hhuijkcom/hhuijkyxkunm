name: 完整生成Lua测试
run-name: 单ID完整生成测试
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Node20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装steam-user依赖
        run: npm install steam-user

      - name: 执行完整测试脚本
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: node test-full.js

      - name: 提交生成的lua文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🧪测试：完整生成lua文件"
          branch: main
          file_patterns: lua/**/*.lua
