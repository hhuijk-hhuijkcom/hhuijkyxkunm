name: 测试生成Lua
run-name: 测试机器人输出文件
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行测试脚本
        run: node test-generate.js

      - name: 提交文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🧪 测试：自动生成lua文件"
          branch: main
          file_patterns: lua/**/*.lua
